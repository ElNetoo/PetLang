<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PetLang — Relatório de Saúde</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .pet-icon {
            font-size: 2.5rem;
        }

        .pet-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: #2d2d2d;
        }

        .especie-badge {
            background: #ede0ff;
            color: #5b2d8e;
            border-radius: 20px;
            padding: 3px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: capitalize;
        }

        .diagnosticos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .diag-card {
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .diag-card .label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
        }

        .diag-card .valor {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
        }

        .diag-card .status-texto {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .verde   { background: #e8f5e9; color: #2e7d32; }
        .amarelo { background: #fff8e1; color: #f57f17; }
        .vermelho { background: #ffebee; color: #c62828; }
        .cinza   { background: #f5f5f5; color: #757575; }

        .alertas {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }

        .alerta {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: 0.88rem;
            color: #856404;
        }

        .alerta.critico {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }

        .alerta.ok {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #2e7d32;
        }

        section {
            margin-bottom: 1.2rem;
        }

        section h3 {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 0.6rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #5b2d8e;
            color: white;
            padding: 8px 12px;
            text-align: left;
            font-size: 0.85rem;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        tr:hover td {
            background: #f9f3ff;
        }

        .badge {
            display: inline-block;
            background: #7b4dab;
            color: white;
            border-radius: 20px;
            padding: 3px 14px;
            font-size: 0.82rem;
            margin: 3px;
        }

        .empty {
            color: #aaa;
            font-style: italic;
            font-size: 0.88rem;
        }

        footer {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 PetLang</h1>
        <p class="subtitle">Relatório de Saúde e Diagnóstico Nutricional</p>

        {{CARDS}}

        <footer>
            Gerado por PetLang Compiler &mdash; Linguagem de Domínio Específico para Cuidados com Pets
            <br><br>
            Desenvolvido por: <strong style="color: rgba(255,255,255,0.9);">Francisco Neto & Ianny Kerlyn</strong>
</footer>
    </div>
</body>
</html>
